name: Deploy Sanity Studio

on:
  push:
    branches: ['main']
    paths: ['cms/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: '.node-version'
          cache: true
          run-install: |
            args: ['--frozen-lockfile', '--filter', 'cms...']

      - name: Deploy to Sanity
        run: vp run cms:deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
