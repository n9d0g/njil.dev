name: Deploy to Cloudflare Workers

on:
  push:
    branches: ['dev', 'main']

# Deploys of a branch run one at a time, in order, and are never cancelled
# partway, so two releases can't claim the same version.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # To create the release and push the version bump (ADR-0004)
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve deploy target
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "site_name=njil.dev" >> "$GITHUB_OUTPUT"
            echo "deploy_url=https://njil.dev" >> "$GITHUB_OUTPUT"
          else
            echo "site_name=dev.njil.dev" >> "$GITHUB_OUTPUT"
            echo "deploy_url=https://dev.njil.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: '.node-version'
          cache: true

      - name: Check
        run: vp check

      - name: Test
        run: vp test run

      # The version a push to main releases (ADR-0004): the last v* tag,
      # bumped as the push's conventional commits ask (scripts/next-version.ts).
      # Tags are the counter; package.json mirrors them and the footer reads
      # it. Nothing to release (chore, ci, docs…) keeps the current version.
      # A re-run of an already-tagged commit keeps its version. dev deploys
      # don't release and build with package.json as it is.
      - name: Version
        id: version
        if: github.ref_name == 'main'
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          TAGS=$(git ls-remote --tags origin 'v*')
          HERE=$(awk -v sha="$GITHUB_SHA" '$1 == sha { sub("refs/tags/v", "", $2); sub(/\^\{\}$/, "", $2); print $2 }' <<< "$TAGS" | head -1)
          LAST=$(sed -nE 's#.*refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$#\1#p' <<< "$TAGS" | sort -V | tail -1)
          LAST=${LAST:-0.0.0}
          if [ -n "$HERE" ]; then
            VERSION="$HERE"; NEW=""
          else
            MESSAGES=$(jq -c 'if type == "array" and length > 0 then map(.message) else empty end' <<< "$COMMITS_JSON" 2>/dev/null || true)
            [ -n "$MESSAGES" ] || MESSAGES=$(git log -1 --format=%B | jq -Rs '[.]')
            NEW=$(node scripts/next-version.ts "$LAST" <<< "$MESSAGES")
            VERSION="${NEW:-$LAST}"
          fi
          sed -i -E 's/^(\t"version": )"[^"]*"/\1"'"$VERSION"'"/' package.json
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          if [ -n "$NEW" ]; then
            echo "Releases v${NEW} (after v${LAST})." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No new version: stays v${VERSION}." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: vp run build
        env:
          CLOUDFLARE_ENV: ${{ github.ref_name == 'dev' && 'dev' || '' }}
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.PUBLIC_RECAPTCHA_SITE_KEY }}
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Deploy to Cloudflare
        id: deploy
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Only once the deploy is live, so a version always means "this ran".
      # The tag goes on the deployed commit; the package.json bump goes on top
      # of main and dev as they are now (another PR may have merged
      # meanwhile). Pushes with the built-in token don't start another deploy.
      - name: Release
        id: release
        if: steps.version.outputs.new != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.new }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          NOTES=$(jq -r 'if type == "array" and length > 0 then map(.message | split("\n")[0] | select(startswith("Merge ") | not) | "- " + .) | join("\n") else empty end' <<< "$COMMITS_JSON" 2>/dev/null || true)
          [ -n "$NOTES" ] || NOTES="- $(git log -1 --format=%s)"
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes "$NOTES"

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for BRANCH in main dev; do
            DONE=""
            for _ in 1 2 3; do
              git fetch --depth=1 origin "$BRANCH"
              git checkout -f -B "bump-${BRANCH}" FETCH_HEAD
              sed -i -E 's/^(\t"version": )"[^"]*"/\1"'"$VERSION"'"/' package.json
              if git diff --quiet; then DONE=1; break; fi # already bumped
              git commit -qam "chore: release ${VERSION}"
              if git push origin "HEAD:${BRANCH}"; then DONE=1; break; fi
              sleep 5
            done
            [ -n "$DONE" ] || echo "::warning::Couldn't push the package.json bump to ${BRANCH}; the next release sets it."
          done

      - name: Notify Discord
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          SITE_NAME: ${{ steps.target.outputs.site_name }}
          DEPLOY_URL: ${{ steps.target.outputs.deploy_url }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          COMPARE_URL: ${{ github.event.compare }}
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set, skipping notification."
            exit 0
          fi

          BRANCH="${GITHUB_REF#refs/heads/}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          RUN_URL="${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="${REPO_URL}/commit/${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          case "$DEPLOY_OUTCOME" in
            success) TITLE="🚀 ${SITE_NAME} deployed successfully"; COLOR=5763719; TITLE_URL="$DEPLOY_URL" ;;
            failure) TITLE="❌ ${SITE_NAME} deployment failed"; COLOR=15548997; TITLE_URL="$RUN_URL" ;;
            *) TITLE="⚠️ ${SITE_NAME} deployment ${DEPLOY_OUTCOME}"; COLOR=16705372; TITLE_URL="$RUN_URL" ;;
          esac

          # Commits in this push, newest first (fall back to HEAD if the payload has none)
          COMMITS=$(jq -r '
            if type == "array" and length > 0 then
              length as $n
              | (.[-10:] | reverse
                 | map("[`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0] | .[0:72]) — \(.author.username // .author.name)")
                 | join("\n"))
                + (if $n > 10 then "\n…and \($n - 10) more" else "" end)
            else empty end' <<< "$COMMITS_JSON" 2>/dev/null || true)
          if [ -z "$COMMITS" ]; then
            COMMITS="[\`${SHORT_SHA}\`](${COMMIT_URL}) $(git log -1 --pretty=%s | cut -c1-72)"
          fi

          # The version a main deploy put live: new in this deploy, or unchanged
          VERSION_TEXT=""
          if [ -n "$NEW_VERSION" ] && [ "$RELEASE_OUTCOME" = "success" ]; then
            VERSION_TEXT="[v${NEW_VERSION}](${REPO_URL}/releases/tag/v${NEW_VERSION})"
          fi

          DURATION=""
          STARTED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at 2>/dev/null || true)
          if [ -n "$STARTED_AT" ]; then
            ELAPSED=$(( $(date +%s) - $(date -d "$STARTED_AT" +%s) ))
            DURATION="$((ELAPSED / 60))m $((ELAPSED % 60))s"
          fi

          # On a successful dev deploy, link to the open dev → main PR, or to a prefilled one
          AHEAD=""; PR_LABEL=""; PR_URL=""
          if [ "$BRANCH" = "dev" ] && [ "$DEPLOY_OUTCOME" = "success" ]; then
            AHEAD=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...dev" --jq .ahead_by 2>/dev/null || true)
            OPEN_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head dev --base main --state open \
              --json number,url --jq '.[0] | select(.) | "\(.number) \(.url)"' 2>/dev/null || true)
            if [ -n "$OPEN_PR" ]; then
              PR_LABEL="🔀 View PR #${OPEN_PR%% *}"; PR_URL="${OPEN_PR#* }"
            elif [ "${AHEAD:-0}" -gt 0 ]; then
              PR_LABEL="🔀 Create PR → main"; PR_URL="${REPO_URL}/compare/main...dev?expand=1"
            fi
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" --arg title_url "$TITLE_URL" --argjson color "$COLOR" \
            --arg commits "$COMMITS" --arg branch "$BRANCH" --arg sha "$SHORT_SHA" \
            --arg commit_url "$COMMIT_URL" --arg actor "$GITHUB_ACTOR" --arg duration "$DURATION" \
            --arg ahead "$AHEAD" --arg run_number "$GITHUB_RUN_NUMBER" --arg timestamp "$TIMESTAMP" \
            --arg outcome "$DEPLOY_OUTCOME" --arg site_url "$DEPLOY_URL" --arg run_url "$RUN_URL" \
            --arg compare_url "$COMPARE_URL" --arg pr_label "$PR_LABEL" --arg pr_url "$PR_URL" \
            --arg version "$VERSION_TEXT" \
            '{
              embeds: [{
                title: $title, url: $title_url, color: $color, description: $commits,
                fields: (
                  [
                    {name: "Branch", value: ("`" + $branch + "`"), inline: true},
                    {name: "Commit", value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                    {name: "Triggered by", value: $actor, inline: true}
                  ]
                  + (if $version != "" then [{name: "Version", value: $version, inline: true}] else [] end)
                  + (if $duration != "" then [{name: "Duration", value: $duration, inline: true}] else [] end)
                  + (if $ahead != "" then [{name: "Ahead of main", value: ($ahead + " commit(s)"), inline: true}] else [] end)
                ),
                footer: {text: ("Run #" + $run_number)},
                timestamp: $timestamp
              }],
              components: [{
                type: 1,
                components: (
                  (if $outcome == "success" then [{type: 2, style: 5, label: "🌐 Visit site", url: $site_url}] else [] end)
                  + [{type: 2, style: 5, label: "📋 Workflow run", url: $run_url}]
                  + (if $compare_url != "" then [{type: 2, style: 5, label: "🔍 View changes", url: $compare_url}] else [] end)
                  + (if $pr_url != "" then [{type: 2, style: 5, label: $pr_label, url: $pr_url}] else [] end)
                )
              }]
            }')

          # with_components lets a plain webhook send link buttons
          curl -fsS -H "Content-Type: application/json" -X POST -d "$PAYLOAD" \
            "${DISCORD_WEBHOOK_URL}?with_components=true"
