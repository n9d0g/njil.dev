name: Deploy to Cloudflare Workers

on:
  push:
    branches: ['dev', 'main']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: '.node-version'
          cache: true

      - name: Check
        run: vp check

      - name: Test
        run: vp test run

      - name: Build
        run: vp run build
        env:
          CLOUDFLARE_ENV: ${{ github.ref_name == 'dev' && 'dev' || '' }}
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.PUBLIC_RECAPTCHA_SITE_KEY }}
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}

      - name: Deploy to Cloudflare
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify Discord
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set, skipping notification"
            exit 0
          fi

          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ' | cut -c1-100)
          BRANCH=${GITHUB_REF#refs/heads/}
          DEPLOY_TIME=$(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %Z')

          if [ "$BRANCH" == "main" ]; then
            DEPLOY_URL="https://njil.dev"
            SITE_NAME="njil.dev"
          else
            DEPLOY_URL="https://dev.njil.dev"
            SITE_NAME="dev.njil.dev"
          fi

          MSG="🚀 **$SITE_NAME** deployed successfully!\n\n\`\`\`Branch: $BRANCH\nCommit: $COMMIT_SHA\nDetails: $COMMIT_MSG\nTime: $DEPLOY_TIME\n\`\`\`\n\n🔗 **Live URL:** $DEPLOY_URL"

          curl -fsS -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"$MSG\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
