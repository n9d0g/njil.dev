name: Deploy to Cloudflare Workers

on:
  push:
    branches: ['dev', 'main']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve deploy target
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "site_name=njil.dev" >> "$GITHUB_OUTPUT"
            echo "deploy_url=https://njil.dev" >> "$GITHUB_OUTPUT"
          else
            echo "site_name=dev.njil.dev" >> "$GITHUB_OUTPUT"
            echo "deploy_url=https://dev.njil.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: '.node-version'
          cache: true

      - name: Check
        run: vp check

      - name: Test
        run: vp test run

      - name: Build
        run: vp run build
        env:
          CLOUDFLARE_ENV: ${{ github.ref_name == 'dev' && 'dev' || '' }}
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.PUBLIC_RECAPTCHA_SITE_KEY }}
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}

      - name: Deploy to Cloudflare
        id: deploy
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify Discord
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SITE_NAME: ${{ steps.target.outputs.site_name }}
          DEPLOY_URL: ${{ steps.target.outputs.deploy_url }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          COMPARE_URL: ${{ github.event.compare }}
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set, skipping notification."
            exit 0
          fi

          BRANCH="${GITHUB_REF#refs/heads/}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          RUN_URL="${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="${REPO_URL}/commit/${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          case "$DEPLOY_OUTCOME" in
            success) TITLE="🚀 ${SITE_NAME} deployed successfully"; COLOR=5763719; TITLE_URL="$DEPLOY_URL" ;;
            failure) TITLE="❌ ${SITE_NAME} deployment failed"; COLOR=15548997; TITLE_URL="$RUN_URL" ;;
            *) TITLE="⚠️ ${SITE_NAME} deployment ${DEPLOY_OUTCOME}"; COLOR=16705372; TITLE_URL="$RUN_URL" ;;
          esac

          # Commits in this push, newest first (fall back to HEAD if the payload has none)
          COMMITS=$(jq -r '
            if type == "array" and length > 0 then
              length as $n
              | (.[-10:] | reverse
                 | map("[`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0] | .[0:72]) — \(.author.username // .author.name)")
                 | join("\n"))
                + (if $n > 10 then "\n…and \($n - 10) more" else "" end)
            else empty end' <<< "$COMMITS_JSON" 2>/dev/null || true)
          if [ -z "$COMMITS" ]; then
            COMMITS="[\`${SHORT_SHA}\`](${COMMIT_URL}) $(git log -1 --pretty=%s | cut -c1-72)"
          fi

          DURATION=""
          STARTED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at 2>/dev/null || true)
          if [ -n "$STARTED_AT" ]; then
            ELAPSED=$(( $(date +%s) - $(date -d "$STARTED_AT" +%s) ))
            DURATION="$((ELAPSED / 60))m $((ELAPSED % 60))s"
          fi

          # On a successful dev deploy, link to the open dev → main PR, or to a prefilled one
          AHEAD=""; PR_LABEL=""; PR_URL=""
          if [ "$BRANCH" = "dev" ] && [ "$DEPLOY_OUTCOME" = "success" ]; then
            AHEAD=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...dev" --jq .ahead_by 2>/dev/null || true)
            OPEN_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head dev --base main --state open \
              --json number,url --jq '.[0] | select(.) | "\(.number) \(.url)"' 2>/dev/null || true)
            if [ -n "$OPEN_PR" ]; then
              PR_LABEL="🔀 View PR #${OPEN_PR%% *}"; PR_URL="${OPEN_PR#* }"
            elif [ "${AHEAD:-0}" -gt 0 ]; then
              PR_LABEL="🔀 Create PR → main"; PR_URL="${REPO_URL}/compare/main...dev?expand=1"
            fi
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" --arg title_url "$TITLE_URL" --argjson color "$COLOR" \
            --arg commits "$COMMITS" --arg branch "$BRANCH" --arg sha "$SHORT_SHA" \
            --arg commit_url "$COMMIT_URL" --arg actor "$GITHUB_ACTOR" --arg duration "$DURATION" \
            --arg ahead "$AHEAD" --arg run_number "$GITHUB_RUN_NUMBER" --arg timestamp "$TIMESTAMP" \
            --arg outcome "$DEPLOY_OUTCOME" --arg site_url "$DEPLOY_URL" --arg run_url "$RUN_URL" \
            --arg compare_url "$COMPARE_URL" --arg pr_label "$PR_LABEL" --arg pr_url "$PR_URL" \
            '{
              embeds: [{
                title: $title, url: $title_url, color: $color, description: $commits,
                fields: (
                  [
                    {name: "Branch", value: ("`" + $branch + "`"), inline: true},
                    {name: "Commit", value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                    {name: "Triggered by", value: $actor, inline: true}
                  ]
                  + (if $duration != "" then [{name: "Duration", value: $duration, inline: true}] else [] end)
                  + (if $ahead != "" then [{name: "Ahead of main", value: ($ahead + " commit(s)"), inline: true}] else [] end)
                ),
                footer: {text: ("Run #" + $run_number)},
                timestamp: $timestamp
              }],
              components: [{
                type: 1,
                components: (
                  (if $outcome == "success" then [{type: 2, style: 5, label: "🌐 Visit site", url: $site_url}] else [] end)
                  + [{type: 2, style: 5, label: "📋 Workflow run", url: $run_url}]
                  + (if $compare_url != "" then [{type: 2, style: 5, label: "🔍 View changes", url: $compare_url}] else [] end)
                  + (if $pr_url != "" then [{type: 2, style: 5, label: $pr_label, url: $pr_url}] else [] end)
                )
              }]
            }')

          # with_components lets a plain webhook send link buttons
          curl -fsS -H "Content-Type: application/json" -X POST -d "$PAYLOAD" \
            "${DISCORD_WEBHOOK_URL}?with_components=true"
